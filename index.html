<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- O GitHub Pages não permite cabeçalhos HTTP próprios: a política de segurança vai aqui.
       Scripts só deste site e da biblioteca oficial do Supabase (versão fixa); nada de script inline.
       img-src inclui o Supabase para mostrar comprovantes (links assinados, temporários). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Controle Financeiro</title>
  <link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
  <link rel="alternate icon" href="icons/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <!-- iPhone não aceita SVG na tela de início: precisa de PNG quadrado, sem cantos (o iOS arredonda sozinho) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="auth">
  <div class="layout" id="layout">
    <main id="app" tabindex="-1"><div class="loading"><span class="spinner"></span>Carregando…</div></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <noscript>Este sistema precisa de JavaScript habilitado.</noscript>
</body>
</html>
