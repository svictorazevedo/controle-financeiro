<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <!-- O GitHub Pages não permite cabeçalhos HTTP próprios: a política de segurança vai aqui.
       Scripts só deste site e da biblioteca oficial do Supabase (versão fixa); nada de script inline. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Controle Financeiro</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="brand">💰 <span>Controle Financeiro</span></div>
    <nav id="nav" aria-label="Seções"></nav>
    <div class="top-controls">
      <label class="sr-only" for="house-select">Casa</label>
      <select id="house-select"></select>
      <label class="sr-only" for="month-input">Mês</label>
      <input type="month" id="month-input">
      <button type="button" class="btn ghost" id="logout-btn">Sair</button>
    </div>
  </header>
  <main id="app" tabindex="-1"><p class="muted center">Carregando…</p></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <noscript>Este sistema precisa de JavaScript habilitado.</noscript>
</body>
</html>
